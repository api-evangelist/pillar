aid: pillar
name: Pillar
description: >-
  Pillar is an Italian construction-technology company, founded in 2025 and
  headquartered in Milan, building what it calls the operating system for the
  construction industry (il sistema operativo per l'edilizia). Its cloud platform
  unifies the back office of building firms (imprese edili) — invoicing
  (fatturazione), cash-flow management (flussi di cassa), bank reconciliation,
  quotes and estimates (preventivi), procurement, job and project cost control
  (gestione commessa), and delivery notes and site work reports (DDT e rapportini)
  — alongside on-site safety (Pillar Sicurezza) and an AI layer (Pillar AI) that
  automates data entry in real time, including inputs captured from the job site
  over WhatsApp. Pillar is backed by Earlybird Venture Capital and today reaches
  customers through a book-a-demo model rather than a public self-serve signup or
  a developer-facing API; no public API, SDK, or developer documentation surface
  was found during enrichment.
